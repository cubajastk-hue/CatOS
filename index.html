<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>catOS</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- WELCOME WINDOW -->
  <div class="window" id="welcome">
    <div id="welcomeheader" class="window-header">
      <span class="window-title">catOS</span>
      <div class="window-controls">
        <span id="welcomeclose" class="close-btn" title="Zavřít">✕</span>
      </div>
    </div>

    <h1 class="OS">Welcome to catOS</h1>
    <h2 class="Introduction">Hi, Iam Jastk and I am creating my second projects with HTML and CSS.</h2>

    <img src="images/Croissant.png" class="Crossaint1" alt="Croissant" />
    <img src="images/Croissant.png" class="Crossaint2" alt="Croissant" />
    <img src="images/Croissant.png" class="Crossaint3" alt="Croissant" />

    <div>
      <a href="https://www.instagram.com/stardance.hackclub/" target="_blank" rel="noopener noreferrer">
        <img src="images/Instagram.webp" class="Instagram" alt="Instagram">
      </a>
      <a href="https://stardance.hackclub.com/home" target="_blank" rel="noopener noreferrer">
        <img src="images/Google.png" class="Google" alt="Google">
      </a>
    </div>
  </div>

  <!-- NOTES WINDOW -->
  <div class="window" id="notes">
    <div class="window-header" id="notesheader">
      <span class="window-title">catNote</span>
      <div class="window-controls">
        <span id="notesclose" class="close-btn" title="Close">✕</span>
      </div>
    </div>

    <div class="notes-container">
      <div class="notes-sidebar" id="noteSidebar"></div>
      <div class="note-content" id="noteContent"></div>
    </div>
  </div>

  <!-- CATOFY WINDOW -->
<div class="window" id="catofy">
  <div class="window-header" id="catofyheader">
    <span class="window-title">catOfy</span>
    <div class="window-controls">
      <span id="catofyclose" class="close-btn" title="Close">✕</span>
    </div>
  </div>

  <div class="catofy-container">
    <div class="track-list" id="trackList">
    </div>
  </div>
</div>

<!-- CATTEMP WINDOW -->
<div class="window" id="cattemp">
  <div class="window-header" id="cattempheader">
    <span class="window-title">catTemp</span>
    <div class="window-controls">
      <span id="cattempclose" class="close-btn" title="Close">✕</span>
    </div>
  </div>

  <div class="cattemp-container">
    <p class="cattemp-subtitle">Choose Template</p>
    
    <div class="template-grid">
      <div class="template-card active" data-theme="coffee">
        <div class="theme-preview preview-coffee"></div>
        <p>1. Coffee</p>
      </div>

      <div class="template-card" data-theme="cat">
        <div class="theme-preview preview-cat"></div>
        <p>2. Cat</p>
      </div>

      <div class="template-card" data-theme="beans">
        <div class="theme-preview preview-beans"></div>
        <p>3. Coffee Beans</p>
      </div>

      <div class="template-card" data-theme="barista">
        <div class="theme-preview preview-barista"></div>
        <p>4. Barista Cat</p>
      </div>
    </div>
  </div>
</div>

<!-- CATGAME WINDOW -->
<div class="window" id="catgame">
  <div class="window-header" id="catgameheader">
    <span class="window-title">CatGame</span>
    <div class="window-controls">
      <span id="catgameclose" class="close-btn" title="Close">✕</span>
    </div>
  </div>

  <div class="catgame-container">
    <div id="cg-status" class="cg-status">Your turn (X)</div>

    <div class="cg-board" id="cg-board">
      <button class="cg-cell" data-index="0"></button>
      <button class="cg-cell" data-index="1"></button>
      <button class="cg-cell" data-index="2"></button>
      <button class="cg-cell" data-index="3"></button>
      <button class="cg-cell" data-index="4"></button>
      <button class="cg-cell" data-index="5"></button>
      <button class="cg-cell" data-index="6"></button>
      <button class="cg-cell" data-index="7"></button>
      <button class="cg-cell" data-index="8"></button>
    </div>

    <div class="cg-controls">
      <button id="cg-restart-btn" class="cat-btn">Restart Game</button>
    </div>
  </div>
</div>


  <!-- FOOTER -->
  <div class="Footer" id="top">
    <p class="Textlogo">catOS</p>
    <p class="Time" id="timeElement">Time</p>
  </div>

  <!-- DESKTOP ICONS -->
  <div class="desktop-apps">
    <div class="App" id="welcomeopen">
      <img src="images/cat.png" alt="catOS" class="app-icon-cat">
    </div>
    <div class="App" id="notesopen">
      <img src="images/wirte.png" alt="catNote" class="app-icon">
    </div>
    <div class="App" id="catofyopen">
      <img src="images/music.png" alt="catOfy" class="app-icon">
    </div>
    <div class="App" id="cattempopen">
      <img src="images/paintbrush.png" alt="catTemp" class="app-icon">
    </div>
    <div class="App" id="catgameopen" title="CatGame">
      <img src="images/poker-chip.png" alt="CatGame" class="app-icon">
     </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
